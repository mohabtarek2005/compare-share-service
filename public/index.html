<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare timetables · Class Timetable Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body data-page="compare">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <span class="brand">Class Timetable Builder</span>
      <nav aria-label="Compare and Share">
        <a href="index.html" aria-current="page">Compare</a>
        <a href="share.html">Share</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Compare timetables</h1>
    <p class="lead">Pick 2 to 5 of your saved timetables and choose how to rank them.</p>

    <div id="compare-status" class="status" hidden></div>

    <form id="compare-form" class="card" novalidate>
      <fieldset>
        <legend>Your saved timetables</legend>
        <div id="timetable-picker"></div>
        <div id="manual-field" class="field" hidden>
          <label for="manual-ids">Timetable ids (separate with commas)</label>
          <input id="manual-ids" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. tt-1, tt-2">
        </div>
        <p id="selection-hint" class="muted" aria-live="polite"></p>
      </fieldset>

      <div class="field">
        <label for="criterion">Rank by</label>
        <select id="criterion"></select>
      </div>

      <button id="compare-button" class="button primary" type="submit">Compare</button>
    </form>

    <section id="compare-results" class="results" aria-live="polite"></section>
  </main>
</body>
</html>
