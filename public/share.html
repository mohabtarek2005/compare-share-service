<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share a timetable · Class Timetable Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body data-page="share">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <span class="brand">Class Timetable Builder</span>
      <nav aria-label="Compare and Share">
        <a href="index.html">Compare</a>
        <a href="share.html" aria-current="page">Share</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Share a timetable</h1>
    <p class="lead">Create a read-only link that other signed-in students can open until it expires.</p>

    <form id="share-form" class="card" novalidate>
      <h2>Create a share link</h2>
      <div id="create-status" class="status" hidden></div>

      <div id="select-field" class="field">
        <label for="share-timetable">Timetable</label>
        <select id="share-timetable"></select>
      </div>
      <div id="manual-field" class="field" hidden>
        <label for="manual-id">Timetable id</label>
        <input id="manual-id" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. tt-1">
      </div>
      <p id="picker-note" class="muted"></p>

      <div class="field">
        <label for="expiry-days">Link expires after (days, 1 to 30)</label>
        <input id="expiry-days" type="number" inputmode="numeric" step="1" value="7" required>
      </div>

      <button id="create-button" class="button primary" type="submit">Create share link</button>
      <div id="new-link"></div>
    </form>

    <section class="card">
      <h2>My active share links</h2>
      <div id="list-status" class="status" hidden></div>
      <div id="shares-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
