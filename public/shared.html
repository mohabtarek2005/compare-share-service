<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Shared timetable · Class Timetable Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body data-page="shared">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <span class="brand">Class Timetable Builder</span>
      <nav aria-label="Compare and Share">
        <a href="index.html">Compare</a>
        <a href="share.html">Share</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <div id="shared-status" class="status" hidden></div>

    <article id="shared-details" class="card" hidden>
      <h1 id="shared-title">Shared timetable</h1>
      <p id="shared-meta" class="muted"></p>
      <div id="shared-schedule"></div>
      <button id="download-button" class="button primary" type="button">Download calendar (.ics)</button>
      <div id="download-status" class="status" hidden></div>
    </article>
  </main>
</body>
</html>
